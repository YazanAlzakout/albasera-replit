name: Build FFmpeg MP2 decoder (Media3, LGPL-safe)

# Re-activated: confirmed via a real IPTV provider's stream (KU: NRT 3 HD -
# HEVC video + MPEG-1 Audio Layer II) that MP2 is genuinely absent from stock
# Android's MediaCodec, and that a competing player app plays the same stream
# with audio at a fraction of this app's size - strong evidence a small,
# MP2-only decoder (this module) is the right fix, not VLC-for-everything.
#
# Push-triggered, scoped to mp2-vlc-support only, and further scoped to only
# fire when this workflow file or the vendored module actually change — not
# on every unrelated commit to that branch.
#
# NOTE: workflow_dispatch was deliberately dropped. GitHub only allows manually
# dispatching a workflow if its YAML file exists on the repository's default
# branch (main here) — confirmed via the Actions API. Since this workflow must
# stay off main until reviewed/proven, `push` is the only trigger that
# actually works from a non-default branch.
#
# RECURSIVE-LOOP SAFETY: the "commit built libraries" step below pushes to the
# same branch/paths this workflow listens on. That push's commit message
# includes "[skip ci]" — GitHub's built-in, platform-level convention that
# suppresses *any* workflow run for that commit, evaluated before path/branch
# filters. This is the sole (and sufficient) loop-prevention mechanism; do not
# remove "[skip ci]" from that commit message.
on:
  push:
    branches:
      - mp2-vlc-support
    paths:
      - ".github/workflows/build-ffmpeg-mp2-decoder.yml"
      - "modules/decoder-ffmpeg-mp2/**"

env:
  # LGPL-safe FFmpeg ref and NDK version, matching
  # modules/decoder-ffmpeg-mp2/android/UPSTREAM_README.md. Native API level
  # must not exceed the app's minSdkVersion (currently 26; module default 24).
  FFMPEG_REF: "release/6.0"
  NDK_VERSION: "r26b"
  ANDROID_ABI: "24"
  TARGET_BRANCH: "mp2-vlc-support"

# contents:write is required so the job can commit the built libraries back to
# mp2-vlc-support (see step below). This does NOT grant access to other
# branches: the trigger's `branches:` filter means this job only ever runs
# checked out at mp2-vlc-support, and the commit step below hardcodes that
# branch name (never derives it from user-controllable input) plus asserts
# github.ref_name matches it before pushing, as defense in depth.
permissions:
  contents: write

jobs:
  build-ffmpeg-mp2:
    name: Build libavcodec/libavutil/libswresample (mp2 decoder only)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout albasera-replit (this repo, this ref only)
        uses: actions/checkout@v4
        with:
          ref: mp2-vlc-support

      - name: Install Android NDK ${{ env.NDK_VERSION }}
        id: setup-ndk
        uses: nttld/setup-ndk@v1
        with:
          ndk-version: ${{ env.NDK_VERSION }}
          # local-cache was true; disabled after a run failed at FFmpeg's
          # configure C-compiler-test step ("unable to create an executable
          # file") with the exact same build script that succeeded on a
          # previous run - a stale/corrupt cached NDK extraction is the
          # leading suspect, since nothing else changed between the two runs.
          local-cache: false

      - name: Install FFmpeg build dependencies
        run: sudo apt-get update && sudo apt-get install -y yasm

      - name: Fetch FFmpeg (${{ env.FFMPEG_REF }})
        run: |
          set -eu
          git clone --depth 1 --branch "${FFMPEG_REF}" https://git.ffmpeg.org/ffmpeg.git ffmpeg-src

      - name: Link FFmpeg source into the decoder module (build-time only)
        run: |
          set -eu
          MODULE_MAIN="modules/decoder-ffmpeg-mp2/android/src/main"
          mkdir -p "${MODULE_MAIN}/jni"
          ln -sfn "$(pwd)/ffmpeg-src" "${MODULE_MAIN}/jni/ffmpeg"

      # Builds only armeabi-v7a and arm64-v8a (per project decision: AlBasera's
      # real Android-phone and Android-TV-box audience is ARM; x86/x86_64 is
      # effectively emulator-only and is intentionally NOT built here).
      #
      # Flags are copied verbatim from the vendored, unmodified upstream
      # modules/decoder-ffmpeg-mp2/android/src/main/jni/build_ffmpeg.sh
      # (androidx/media, Apache-2.0) for the armv7/arm64 blocks only — no
      # reimplementation, no drift from the documented, reviewed script.
      # --enable-decoder=mp2 is the only codec enabled; there is no
      # --enable-gpl or --enable-nonfree anywhere in this file.
      - name: Build FFmpeg (mp2 decoder only) for armeabi-v7a + arm64-v8a
        env:
          NDK_PATH: ${{ steps.setup-ndk.outputs.ndk-path }}
          # ANDROID_ABI comes from the workflow-level env: block above.
        run: |
          set -eu
          # FFmpeg's configure only reports "C compiler test failed" plus a
          # pointer at ffbuild/config.log for the real reason - dump it
          # automatically on any failure in this step so the cause shows up
          # directly in the log instead of needing another round-trip.
          trap 'echo "=== ffbuild/config.log (tail) ==="; tail -n 100 ffbuild/config.log 2>/dev/null || tail -n 100 ffmpeg-src/ffbuild/config.log 2>/dev/null || echo "(no config.log found)"' ERR
          HOST_PLATFORM="linux-x86_64"
          JOBS="$(nproc)"
          # Media3's own FfmpegLibrary.getCodecName() maps AUDIO_MPEG,
          # AUDIO_MPEG_L1, *and* AUDIO_MPEG_L2 (MP2) all to the FFmpeg decoder
          # name "mp3" - confirmed by reading ffmpeg_jni.cc's getCodecByName(),
          # which both ffmpegHasDecoder() and the real ffmpegInitialize() call
          # via avcodec_find_decoder_by_name(). FFmpeg's decoder registered
          # under that name is a generic MPEG-audio decoder that handles all
          # three layers - but only the exact registered name is looked up, so
          # building "mp2" (a real but differently-named FFmpeg decoder entry)
          # left avcodec_find_decoder_by_name("mp3") returning NULL, which is
          # why MP2 playback silently reported "unsupported" end-to-end.
          ENABLED_DECODERS=(mp3)

          COMMON_OPTIONS="
              --target-os=android
              --enable-static
              --disable-shared
              --disable-doc
              --disable-programs
              --disable-everything
              --disable-avdevice
              --disable-avformat
              --disable-swscale
              --disable-postproc
              --disable-avfilter
              --disable-symver
              --enable-swresample
              --extra-ldexeflags=-pie
              --disable-v4l2-m2m
              --disable-vulkan
              "
          for decoder in "${ENABLED_DECODERS[@]}"; do
              COMMON_OPTIONS="${COMMON_OPTIONS} --enable-decoder=${decoder}"
          done
          echo "FFmpeg config (LGPL-safe check): ${COMMON_OPTIONS}" | tr -s ' '

          TOOLCHAIN_PREFIX="${NDK_PATH}/toolchains/llvm/prebuilt/${HOST_PLATFORM}/bin"
          if [[ ! -d "${TOOLCHAIN_PREFIX}" ]]; then
              echo "NDK toolchain not found at ${TOOLCHAIN_PREFIX}"
              exit 1
          fi

          ANDROID_ABI_64BIT="$ANDROID_ABI"
          if [[ "$ANDROID_ABI_64BIT" -lt 21 ]]; then
              ANDROID_ABI_64BIT=21
          fi

          cd ffmpeg-src

          echo "== armeabi-v7a =="
          ./configure \
              --libdir=android-libs/armeabi-v7a \
              --arch=arm \
              --cpu=armv7-a \
              --cross-prefix="${TOOLCHAIN_PREFIX}/armv7a-linux-androideabi${ANDROID_ABI}-" \
              --nm="${TOOLCHAIN_PREFIX}/llvm-nm" \
              --ar="${TOOLCHAIN_PREFIX}/llvm-ar" \
              --ranlib="${TOOLCHAIN_PREFIX}/llvm-ranlib" \
              --strip="${TOOLCHAIN_PREFIX}/llvm-strip" \
              --extra-cflags="-march=armv7-a -mfloat-abi=softfp" \
              --extra-ldflags="-Wl,--fix-cortex-a8" \
              ${COMMON_OPTIONS}
          make -j"$JOBS"
          make install-libs
          make clean

          echo "== arm64-v8a =="
          ./configure \
              --libdir=android-libs/arm64-v8a \
              --arch=aarch64 \
              --cpu=armv8-a \
              --cross-prefix="${TOOLCHAIN_PREFIX}/aarch64-linux-android${ANDROID_ABI_64BIT}-" \
              --nm="${TOOLCHAIN_PREFIX}/llvm-nm" \
              --ar="${TOOLCHAIN_PREFIX}/llvm-ar" \
              --ranlib="${TOOLCHAIN_PREFIX}/llvm-ranlib" \
              --strip="${TOOLCHAIN_PREFIX}/llvm-strip" \
              ${COMMON_OPTIONS}
          make -j"$JOBS"
          make install-libs
          make clean

      # ffmpeg_jni.cc #includes libavcodec/avcodec.h, libavutil/*.h, and
      # libswresample/swresample.h, which themselves transitively include many
      # other headers within those same three directories (including
      # configure-generated ones like libavutil/avconfig.h). Rather than
      # hand-tracing that transitive closure (fragile across FFmpeg version
      # bumps), copy every .h in these three lib dirs — real files, not the
      # CI-only symlink above, since EAS checks out a fresh clone that won't
      # have ffmpeg-src at all. This does NOT vendor FFmpeg's .c sources,
      # build system, docs, or tests — only public headers + the compiled
      # static libs actually needed to link libffmpegJNI.so.
      - name: Vendor FFmpeg headers + built libraries into the module (real files)
        run: |
          set -eu
          DEST="modules/decoder-ffmpeg-mp2/android/src/main/jni/ffmpeg"
          rm -f "${DEST}"   # remove the build-time symlink
          mkdir -p "${DEST}"

          for dir in libavutil libavcodec libswresample; do
            ( cd ffmpeg-src && find "${dir}" -name "*.h" ) | while read -r rel; do
              mkdir -p "${DEST}/$(dirname "${rel}")"
              cp "ffmpeg-src/${rel}" "${DEST}/${rel}"
            done
          done

          for abi in armeabi-v7a arm64-v8a; do
            mkdir -p "${DEST}/android-libs/${abi}"
            cp ffmpeg-src/android-libs/${abi}/*.a "${DEST}/android-libs/${abi}/"
          done

      - name: List vendored headers + libraries
        run: |
          echo "=== Static libraries ==="
          find modules/decoder-ffmpeg-mp2/android/src/main/jni/ffmpeg/android-libs -type f -name "*.a" -exec ls -la {} \;
          echo "=== Header count ==="
          find modules/decoder-ffmpeg-mp2/android/src/main/jni/ffmpeg -type f -name "*.h" | wc -l
          echo "=== Total vendored size ==="
          du -sh modules/decoder-ffmpeg-mp2/android/src/main/jni/ffmpeg

      # Artifact stays scoped to just the .a files (the originally agreed
      # deliverable) even though the commit step below also vendors headers —
      # the commit is now the primary integration path; this artifact remains
      # as a secondary, inspectable copy of just the compiled libraries.
      - name: Upload built libraries as workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: ffmpeg-mp2-decoder-libs
          path: |
            modules/decoder-ffmpeg-mp2/android/src/main/jni/ffmpeg/android-libs/armeabi-v7a/*.a
            modules/decoder-ffmpeg-mp2/android/src/main/jni/ffmpeg/android-libs/arm64-v8a/*.a
          if-no-files-found: error
          retention-days: 14

      # Commits real files (never a symlink) so a fresh checkout on any other
      # machine (EAS's build servers) has everything CMake needs, with no
      # manual copy/extract step required from anyone. [skip ci] in the
      # message is load-bearing — see the loop-prevention note at the top of
      # this file.
      - name: Commit vendored FFmpeg headers + libraries to mp2-vlc-support
        run: |
          set -eu
          if [ "${{ github.ref_name }}" != "${TARGET_BRANCH}" ]; then
            echo "Refusing to commit: ref_name is '${{ github.ref_name }}', expected '${TARGET_BRANCH}'."
            exit 1
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add modules/decoder-ffmpeg-mp2/android/src/main/jni/ffmpeg

          if git diff --staged --quiet; then
            echo "No changes to commit — vendored output is identical to what's already committed."
            exit 0
          fi

          git commit -m "Vendor built FFmpeg MP2 decoder libraries [skip ci]" \
                      -m "Auto-committed by .github/workflows/build-ffmpeg-mp2-decoder.yml after a successful build (FFmpeg ${FFMPEG_REF}, NDK ${NDK_VERSION}, ABIs: armeabi-v7a + arm64-v8a). [skip ci] prevents this push from re-triggering this same workflow."

          git push origin "HEAD:${TARGET_BRANCH}"
